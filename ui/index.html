<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: btmedia:; media-src btmedia:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-src btapercu: 'self'; object-src 'none'">
<title>Jarvis Terminal</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/code.css">
<link rel="stylesheet" href="css/vocal.css">
<link rel="stylesheet" href="css/todo.css">
<link rel="stylesheet" href="css/agents.css">
<link rel="stylesheet" href="css/leviers.css">
<link rel="stylesheet" href="css/atelier.css">
<link rel="stylesheet" href="css/medias.css">
<link rel="stylesheet" href="css/apercu.css">
<link rel="stylesheet" href="css/ecriture.css">
<link rel="stylesheet" href="css/ligne-etat.css">
<link rel="stylesheet" href="css/vocal-direct.css">
<link rel="stylesheet" href="css/scene.css">
<link rel="stylesheet" href="css/machine.css">
</head>
<body>

<!-- Bande native de la coque (28 px) : déplacement de la fenêtre, feux macOS à gauche. Rien de cliquable. -->
<div id="titre-fenetre" class="titre-fenetre" aria-hidden="true"></div>
<div class="faux-feux" aria-hidden="true"><i></i><i></i><i></i></div>

<header id="barre" class="barre">
  <div class="barre-projet">
    <span id="barre-emoji" class="barre-emoji" hidden></span>
    <span id="barre-nom" class="barre-nom">Claude</span>
    <span id="barre-cwd" class="barre-cwd" hidden></span>
  </div>
  <div id="barre-etat" class="barre-etat etat-pret"><span class="point"></span><span id="barre-etat-texte">Prêt</span></div>
  <div id="barre-vocal" class="barre-vocal" hidden><span id="barre-vocal-icone" class="barre-vocal-icone"></span><span id="barre-vocal-texte"></span></div>
  <div id="barre-jetons" class="barre-jetons" hidden></div>
  <div class="barre-espace"></div>
  <button type="button" id="bt-mes-messages" class="barre-bouton" title="Retrouver tes messages (⌥↑ et ⌥↓ pour passer de l’un à l’autre)"><span class="libelle">Mes messages</span><svg class="icone-court" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3h10a1.5 1.5 0 0 1 1.5 1.5v5.5a1.5 1.5 0 0 1-1.5 1.5H7.2L4.5 13.7V11.5H3A1.5 1.5 0 0 1 1.5 10V4.5A1.5 1.5 0 0 1 3 3z"/></svg><span class="compte">0</span></button>
  <label class="barre-choix" title="Modèle de Claude"><span class="barre-choix-nom">Modèle</span><select id="choix-modele" aria-label="Modèle"></select></label>
  <label class="barre-choix" title="Effort de réflexion"><span class="barre-choix-nom">Effort</span><select id="choix-effort" aria-label="Effort"></select></label>
  <label id="choix-permission-boite" class="barre-choix" title="Ce que Claude peut faire sans te demander"><span class="barre-choix-nom">Permissions</span><select id="choix-permission" aria-label="Permissions"></select></label>
  <div class="barre-session">
    <button type="button" id="bt-session" class="barre-bouton" title="Terminal et fermeture de la session" aria-haspopup="menu" aria-expanded="false" aria-controls="menu-session"><svg class="icone-points" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.2" cy="8" r="1.35"/><circle cx="8" cy="8" r="1.35"/><circle cx="12.8" cy="8" r="1.35"/></svg></button>
    <div id="menu-session" class="menu-session" role="menu" hidden>
      <button type="button" id="bt-shell" class="menu-item" role="menuitem"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M4.5 6.5 6.8 8.5 4.5 10.5M8.5 10.5h3"/></svg><span class="menu-textes"><span class="libelle">Ouvrir un terminal ici</span><span class="menu-aide">Dans le dossier du projet. Claude continue dans l’app.</span></span></button>
      <button type="button" id="bt-reprendre-menu" class="menu-item" role="menuitem" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg><span class="menu-textes"><span class="libelle">Reprendre ici</span><span class="menu-aide">Arrête Claude dans Terminal et reprend la même conversation dans l’app.</span></span></button>
      <button type="button" id="bt-terminal" class="menu-item" role="menuitem"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5 8 8M12 9.5v3a1 1 0 0 1-1 1H3.5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3"/></svg><span class="menu-textes"><span class="libelle">Continuer dans Terminal</span><span class="menu-aide">Claude quitte l’app et reprend la même conversation dans Terminal.</span></span></button>
      <div class="menu-sep" role="separator"></div>
      <button type="button" id="bt-fermer" class="menu-item fermer" role="menuitem"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/></svg><span class="menu-textes"><span class="libelle">Fermer la session</span><span class="menu-aide">Arrête Claude et ferme la fenêtre.</span></span></button>
    </div>
  </div>
</header>

<div id="mes-messages" class="popover" hidden>
  <div class="popover-tete"><span class="popover-titre">Mes messages</span><span class="popover-aide">⌥↑ et ⌥↓ pour passer de l’un à l’autre</span></div>
  <ol class="popover-liste"></ol>
</div>

<div id="recherche" class="recherche" hidden role="search">
  <input type="text" placeholder="Rechercher dans la conversation" aria-label="Rechercher" spellcheck="false" autocomplete="off">
  <span class="recherche-compte" aria-live="polite"></span>
  <button type="button" class="recherche-prec" title="Précédent (Maj+Entrée)" aria-label="Précédent"><span class="fleche haut"></span></button>
  <button type="button" class="recherche-suiv" title="Suivant (Entrée)" aria-label="Suivant"><span class="fleche bas"></span></button>
  <button type="button" class="recherche-fermer" title="Fermer (Échap)" aria-label="Fermer"><span class="croix"></span></button>
</div>

<!-- Scène persistante du mode vocal (js/scene.js) : figée sous la barre, au-dessus du fil. -->
<section id="scene" class="scene" hidden aria-label="Scène"></section>

<div id="defile" class="defile">
  <main id="fil" class="fil"></main>
</div>

<footer id="pied" class="pied">
  <button type="button" id="pastille-bas" class="pastille-bas" hidden><span class="fleche bas"></span><span class="pastille-texte">Revenir en bas</span></button>
  <div id="banniere" class="banniere" hidden role="alert"></div>
  <div class="saisie">
    <div id="saisie-reprise" class="saisie-reprise" hidden role="status">
      <span class="saisie-reprise-texte"><b>Tu repars de ce message.</b> À l’envoi, Claude oublie ce message et tout ce qui suit. Les fichiers déjà modifiés restent tels quels.</span>
      <button type="button" id="bt-reprise-annuler" class="saisie-reprise-annuler" title="Annuler (Échap)">Annuler</button>
    </div>
    <div id="saisie-pieces" class="saisie-pieces" hidden></div>
    <textarea id="saisie-texte" rows="1" placeholder="Écris à Claude…" spellcheck="true" aria-label="Message pour Claude"></textarea>
    <div class="saisie-bas">
      <button type="button" id="bt-joindre" class="bouton-joindre" title="Joindre des fichiers : images, PDF, code, dossiers… (tu peux aussi les coller avec ⌘V ou les glisser ici)" aria-label="Joindre des fichiers"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.2 7.6l-5 5a3.2 3.2 0 0 1-4.6-4.5l5.4-5.4a2.1 2.1 0 0 1 3 3L6.7 11a1 1 0 0 1-1.5-1.5l4.6-4.6"/></svg></button>
      <input type="file" id="saisie-fichier" multiple hidden>
      <div id="saisie-statut" class="saisie-statut" hidden><span class="point"></span><span class="saisie-statut-texte"></span></div>
      <button type="button" id="bt-reprendre" class="barre-bouton bouton-reprendre" hidden title="Arrête Claude dans Terminal et reprend la conversation ici">Reprendre ici</button>
      <span class="saisie-espace"></span>
      <button type="button" id="bt-compacter" class="barre-bouton bouton-compacter" title="Résumer la conversation pour libérer du contexte (/compact)"><span class="libelle">Compacter</span><svg class="icone-court" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.5v4.5M5.8 3.8 8 6l2.2-2.2M8 14.5V10M5.8 12.2 8 10l2.2 2.2M2.5 8h11"/></svg></button>
      <button type="button" id="bt-jarvis" class="barre-bouton bouton-jarvis" aria-pressed="false"><span class="libelle">Mode Jarvis</span><span class="libelle-court">Jarvis</span><span class="jarvis-temoin" aria-hidden="true"></span></button>
      <button type="button" id="bt-arreter" class="bouton-arret" hidden title="Arrêter Claude (Échap)">Arrêter</button>
      <button type="button" id="bt-envoyer" class="bouton-envoi" title="Envoyer (Entrée)" aria-label="Envoyer" disabled><span class="fleche haut"></span></button>
    </div>
  </div>
</footer>

<script src="vendor/marked-18.1.1.umd.js"></script>
<script src="vendor/purify-3.4.17.min.js"></script>
<script src="vendor/highlight-11.12.0.min.js"></script>
<script src="js/commun.js"></script>
<script src="js/vocal-reponses.js"></script>
<script src="js/session.js"></script>
<script src="js/medias.js"></script>
<script src="js/markdown.js"></script>
<script src="js/apercu.js"></script>
<script src="js/vue-outils.js"></script>
<script src="js/vue-vocal.js"></script>
<script src="js/vue-questions.js"></script>
<script src="js/atelier.js"></script>
<script src="js/vue-fil.js"></script>
<script src="js/defilement.js"></script>
<script src="js/recherche.js"></script>
<script src="js/interface.js"></script>
<script src="js/commandes.js"></script>
<script src="js/dictee.js"></script>
<script src="js/todo.js"></script>
<script src="js/agents.js"></script>
<script src="js/leviers.js"></script>
<script src="js/menus.js"></script>
<script src="js/ligne-etat.js"></script>
<script src="js/vocal-direct.js"></script>
<script src="js/scene.js"></script>
<script src="js/pont.js"></script>
<script src="js/machine.js"></script>
<script src="js/faux-pont.js"></script>
<script src="js/app.js"></script>
</body>
</html>
