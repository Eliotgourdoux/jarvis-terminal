<!doctype html>
<html><head><meta charset="utf-8">
<!-- Cadre d'aperçu (blocs html, svg, mermaid). Chargé dans une iframe sandbox sans allow-same-origin :
     origine opaque, aucun accès à la page, au pont ni aux fichiers locaux. Le contenu arrive par postMessage. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' btapercu: 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' btapercu: 'unsafe-inline' https:; img-src 'self' btapercu: data: blob: https:; font-src 'self' btapercu: data: https:; media-src data: blob: https:; connect-src https:; frame-src 'none'; form-action 'none'; object-src 'none'">
<script src="cadre.js"></script>
</head><body></body></html>
