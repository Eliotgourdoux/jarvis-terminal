<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;width:1024px;height:1024px;overflow:hidden}
svg{display:block}
</style></head><body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <clipPath id="plaque"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <!-- Or de la charte : #E3C887 → #C9A45C → #8E6E33 -->
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0D9A0"/><stop offset=".45" stop-color="#C9A45C"/><stop offset="1" stop-color="#8E6E33"/>
    </linearGradient>
    <linearGradient id="filet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3C887"/><stop offset=".5" stop-color="#8E6E33"/><stop offset="1" stop-color="#C9A45C"/>
    </linearGradient>
    <linearGradient id="voile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".07"/><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </linearGradient>
    <filter id="ombre" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <!-- Gravure : ombre sombre en dessous, reflet clair au-dessus, pas de lueur -->
    <filter id="grave" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000" flood-opacity=".7"/>
    </filter>
  </defs>
  <g filter="url(#ombre)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="#0B0A0C"/>
    <image xlink:href="nero-carre.jpg" x="62" y="62" width="900" height="900" preserveAspectRatio="xMidYMid slice" clip-path="url(#plaque)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#voile)"/>
    <!-- Filet d'or du cadre, doublé d'un liseré intérieur fin -->
    <rect x="104" y="104" width="816" height="816" rx="182" fill="none" stroke="url(#filet)" stroke-width="8"/>
    <rect x="140" y="140" width="744" height="744" rx="150" fill="none" stroke="#C9A45C" stroke-opacity=".35" stroke-width="2.5"/>
  </g>
  <g filter="url(#grave)">
    <polyline points="282,412 446,532 282,652" fill="none" stroke="url(#or)" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="512" y="618" width="236" height="68" rx="34" fill="url(#or)"/>
  </g>
</svg></body></html>
