<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
svg{display:block}
</style></head><body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23252E"/><stop offset="1" stop-color="#121318"/>
    </linearGradient>
    <linearGradient id="trait" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9A6FF"/><stop offset="1" stop-color="#7B61F0"/>
    </linearGradient>
    <filter id="ombre" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <!-- Grille macOS : carré de 824 px centré, coins ~185 px -->
  <g filter="url(#ombre)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#fond)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#3A3D4A" stroke-width="3"/>
  </g>
  <!-- Barre de fenêtre discrète -->
  <circle cx="232" cy="232" r="20" fill="#3A3D4A"/>
  <circle cx="294" cy="232" r="20" fill="#3A3D4A"/>
  <circle cx="356" cy="232" r="20" fill="#3A3D4A"/>
  <line x1="100" y1="300" x2="924" y2="300" stroke="#2A2C36" stroke-width="4"/>
  <!-- Invite > -->
  <polyline points="262,450 412,562 262,674" fill="none" stroke="url(#trait)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Curseur -->
  <rect x="482" y="642" width="250" height="64" rx="32" fill="#ECECF1"/>
</svg></body></html>
